# ============================================================
# Fenglin Blog API —— 主配置
#
# 数据库连接从环境变量读取，便于本机 / CI 切换：
#   BLOG_DB_URL      默认 jdbc:mysql://127.0.0.1:3306/fenglin_blog
#   BLOG_DB_USERNAME 默认 root
#   BLOG_DB_PASSWORD 无默认值，必须显式提供
#   BLOG_SERVER_PORT 默认 8081
# ============================================================

spring.application.name=blog-api
server.port=${BLOG_SERVER_PORT:8081}

spring.datasource.url=${BLOG_DB_URL:jdbc:mysql://127.0.0.1:3306/fenglin_blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${BLOG_DB_USERNAME:root}
spring.datasource.password=${BLOG_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari：本地开发保持小连接池即可
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# 上传目录（相对路径则相对进程工作目录），同时映射为 /uploads/**
blog.upload.dir=${BLOG_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ==================== MyBatis-Plus ====================
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 逻辑删除：约定字段名 deleted，0 未删 / 1 已删
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.global-config.db-config.id-type=auto

# ==================== JSON / 时区 ====================
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false

# ==================== 日志 ====================
logging.level.root=WARN
logging.level.com.fenglin.blog=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n

# devtools 只保留静态资源热加载，关掉重启以免改一行就重启整个上下文
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# 出错时不返回堆栈，避免泄漏内部信息
server.error.include-stacktrace=never
server.error.include-message=never
